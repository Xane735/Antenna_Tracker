<!DOCTYPE html>
<html>
<head>
  <title>Antenna Tracker UI</title>
  <link rel="stylesheet" href="static/ui.css">

  <!-- Add Leaflet dependencies -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>
  <script src="https://unpkg.com/leaflet.vectorgrid/dist/Leaflet.VectorGrid.bundled.js"></script>
  


</head>

</head>
<body>
    <div id="connection-status">
        <span class="status-indicator status-disconnected" id="ws-indicator"></span>
        <span id="ws-status">Connecting...</span>
    </div>
    
    <div class="container">
        <!-- Top Left: Map -->
         
        <div class="panel panel-map">   <!-- add panel-map class -->
        <div class="panel-title">Map View</div>
        <div id="map-container">
            <div id="map"></div>
        </div>
        </div>

        <!-- Top Right: GPS Data -->
        <div class="panel">
            <div class="panel-title">GPS Telemetry</div>
            
            <div class="gps-section">
                <h3>Base Station</h3>
                <div class="data-grid">
                    <div class="data-item">
                        <div class="data-label">Latitude</div>
                        <div class="data-value" id="base-lat">--</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">Longitude</div>
                        <div class="data-value" id="base-lon">--</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">Altitude</div>
                        <div class="data-value" id="base-alt">--</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">HDOP</div>
                        <div class="data-value" id="base-eph">--</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">Fix Type</div>
                        <div class="data-value" id="base-fix">--</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">Satellites</div>
                        <div class="data-value" id="base-sats">--</div>
                    </div>
                </div>
            </div>
            
            <div class="gps-section">
                <h3>Drone</h3>
                <div class="data-grid">
                    <div class="data-item">
                        <div class="data-label">Latitude</div>
                        <div class="data-value" id="drone-lat">--</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">Longitude</div>
                        <div class="data-value" id="drone-lon">--</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">Altitude</div>
                        <div class="data-value" id="drone-alt">--</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">HDOP</div>
                        <div class="data-value" id="drone-eph">--</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">Fix Type</div>
                        <div class="data-value" id="drone-fix">--</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">Satellites</div>
                        <div class="data-value" id="drone-sats">--</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">Azimuth</div>
                        <div class="data-value value-good" id="tracker-az">--</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">Elevation</div>
                        <div class="data-value value-good" id="tracker-el">--</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Bottom Left: Reserved -->
        <div class="panel">
            <div class="panel-title">Reserved</div>
            <div style="display: flex; align-items: center; justify-content: center; height: calc(100% - 40px); color: #555;">
                Additional features coming soon
            </div>
        </div>
        
        <!-- Bottom Right: Manual Control -->
        <div class="panel">
            <div class="panel-title">Manual Control</div>
            <div id="joystick-container">
                <div id="joystick">
                    <div id="joystick-handle"></div>
                </div>
                <div class="control-buttons">
                    <button class="btn" onclick="toggleMode()">Toggle Mode</button>
                    <button class="btn btn-primary" onclick="calibrate()">Calibrate</button>
                </div>
                <div style="margin-top: 15px; font-size: 12px; color: #666;">
                    Mode: <span id="current-mode" style="color: #4ade80;">AUTO</span>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        (() => {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        console.log(gl ? "✅ WebGL is working" : "❌ WebGL not supported or disabled");
        })();
        
        
        if (!window.maplibregl || typeof maplibregl.Map !== "function") {
  console.error("❌ MapLibre not loaded correctly; falling back to Leaflet.");
  const map = L.map('map', { center:[12.9716,77.5946], zoom:12 });
  L.vectorGrid.protobuf('/tiles/{z}/{x}/{y}.pbf', {
    maxNativeZoom: 14,
    maxZoom: 18,
    vectorTileLayerStyles: () => ({
      color:'#666', weight:0.8, fill:true, fillColor:'#777', fillOpacity:0.35
    }),
    rendererFactory: L.canvas.tile
  }).addTo(map);
} else {
  console.log("✅ MapLibre version:", maplibregl.version);
  // proceed with MapLibre init
  const map = new maplibregl.Map({
    container: 'map',
    center: [77.5946, 12.9716],
    zoom: 12,
    style: {
      version: 8,
      sources: {
        local: {
          type: 'vector',
          tiles: [`${window.location.origin}/tiles/{z}/{x}/{y}.pbf`],
          maxzoom: 14
        }
      },
      layers: [
        { id:'bg', type:'background', paint:{'background-color':'#eaeaea'} },
        { id:'water', type:'fill', source:'local', 'source-layer':'water',
          paint:{'fill-color':'#a6cee3'} }
      ]
    }
  });

        // 3) Add layers that likely exist in OpenMapTiles v3.11
        map.on('load', () => {
        // transportation (roads)
        map.addLayer({
            id:'transportation',
            type:'line',
            source:'local', 'source-layer':'transportation',
            paint:{ 'line-color':'#b36b00', 'line-width': ['interpolate',['linear'],['zoom'],8,0.3,12,1.2,15,2.2] }
        });

        // water
        map.addLayer({
            id:'water',
            type:'fill',
            source:'local', 'source-layer':'water',
            paint:{ 'fill-color':'#a6cee3' }
        });

        // buildings
        map.addLayer({
            id:'building',
            type:'fill',
            source:'local', 'source-layer':'building',
            paint:{ 'fill-color':'#c8c8c8','fill-opacity':0.6 }
        });

        // landuse
        map.addLayer({
            id:'landuse',
            type:'fill',
            source:'local', 'source-layer':'landuse',
            paint:{ 'fill-color':'#e5e3df' }
        });

        // labels (requires glyphs; if you’re fully offline and don’t host fonts, this will silently skip)
        map.addLayer({
            id:'place-labels',
            type:'symbol',
            source:'local', 'source-layer':'place',
            layout:{
            'text-field':['get','name'],
            'text-size':['interpolate',['linear'],['zoom'],8,10,12,12,15,16],
            'text-font':['Open Sans Regular','Arial Unicode MS Regular']
            },
            paint:{
            'text-color':'#2b2b2b',
            'text-halo-color':'#ffffff',
            'text-halo-width':1.2
            }
        });

        // If the panel lays out late, ensure it sizes correctly
        map.resize();
        });

        // Helpful console visibility for errors/missing layers
        map.on('error', e => console.error('MapLibre error', e));
    }


        let ws;
        let joystickActive = false;
        let joystickCenter = { x: 0, y: 0 };
        
        // WebSocket connection
        function connectWebSocket() {
            ws = new WebSocket(`ws://${window.location.host}/ws`);
            
            ws.onopen = () => {
                document.getElementById('ws-status').textContent = 'Connected';
                document.getElementById('ws-indicator').className = 'status-indicator status-connected';
            };
            
            ws.onclose = () => {
                document.getElementById('ws-status').textContent = 'Disconnected';
                document.getElementById('ws-indicator').className = 'status-indicator status-disconnected';
                setTimeout(connectWebSocket, 3000);
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                updateUI(data);
            };
        }
        
        // Update UI with incoming data
        function updateUI(data) {
            // Base GPS
            document.getElementById('base-lat').textContent = data.base.lat.toFixed(7);
            document.getElementById('base-lon').textContent = data.base.lon.toFixed(7);
            document.getElementById('base-alt').textContent = data.base.alt.toFixed(2) + ' m';
            document.getElementById('base-eph').textContent = data.base.eph ? data.base.eph.toFixed(2) : '--';
            document.getElementById('base-fix').textContent = data.base.fix_type || '--';
            document.getElementById('base-sats').textContent = data.base.sats || '--';
            
            // Drone GPS
            document.getElementById('drone-lat').textContent = data.drone.lat.toFixed(7);
            document.getElementById('drone-lon').textContent = data.drone.lon.toFixed(7);
            document.getElementById('drone-alt').textContent = data.drone.alt.toFixed(2) + ' m';
            document.getElementById('drone-eph').textContent = data.drone.eph ? data.drone.eph.toFixed(2) : '--';
            document.getElementById('drone-fix').textContent = data.drone.fix_type || '--';
            document.getElementById('drone-sats').textContent = data.drone.sats || '--';

            // Tracker state
            document.getElementById('tracker-az').textContent = data.tracker.azimuth.toFixed(2) + '°';
            document.getElementById('tracker-el').textContent = data.tracker.elevation.toFixed(2) + '°';
            document.getElementById('current-mode').textContent = data.tracker.mode.toUpperCase();
        }
        
        // Joystick control
        const joystick = document.getElementById('joystick');
        const handle = document.getElementById('joystick-handle');
        
        joystick.addEventListener('mousedown', startJoystick);
        document.addEventListener('mousemove', moveJoystick);
        document.addEventListener('mouseup', stopJoystick);
        
        function startJoystick(e) {
            joystickActive = true;
            const rect = joystick.getBoundingClientRect();
            joystickCenter = {
                x: rect.left + rect.width / 2,
                y: rect.top + rect.height / 2
            };
        }
        
        function moveJoystick(e) {
            if (!joystickActive) return;
            
            const dx = e.clientX - joystickCenter.x;
            const dy = e.clientY - joystickCenter.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const maxDistance = 70;
            
            let x = dx;
            let y = dy;
            
            if (distance > maxDistance) {
                x = (dx / distance) * maxDistance;
                y = (dy / distance) * maxDistance;
            }
            
            handle.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
            
            // Send control command
            const azDelta = (x / maxDistance) * 5; // Scale to degrees
            const elDelta = -(y / maxDistance) * 5;
            
            sendManualControl(azDelta, elDelta);
        }
        
        function stopJoystick() {
            joystickActive = false;
            handle.style.transform = 'translate(-50%, -50%)';
        }
        
        // API calls
        function sendManualControl(azDelta, elDelta) {
            fetch('/api/manual_control', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'move',
                    azimuth_delta: azDelta,
                    elevation_delta: elDelta
                })
            });
        }
        
        function toggleMode() {
            fetch('/api/manual_control', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'mode_toggle' })
            });
        }
        
        function calibrate() {
            fetch('/api/calibrate', { method: 'POST' })
                .then(response => response.json())
                .then(data => alert('Calibration started'));
        }
        
        // Initialize
        connectWebSocket();
    </script>
</body>
</html>
